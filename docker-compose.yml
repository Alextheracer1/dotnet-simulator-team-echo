services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: energy-twin-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  dual-port-charger:
    build:
      context: .
      dockerfile: Dual-Port-Charger/Dockerfile
    container_name: energy-twin-dual-port-charger
    restart: unless-stopped
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
      - SIMULATION_MASTER_HOST=${SIMULATION_MASTER_HOST:-host.docker.internal}
      - SIMULATION_MASTER_PORT=${SIMULATION_MASTER_PORT:-1510}
    ports:
      - "1502:1502"
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./logs/charger:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rabbitmq_data:
    name: energy-twin-rabbitmq-data
    driver: local
